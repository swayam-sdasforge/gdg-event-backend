version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: gdg_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gdg_events
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API (Node.js)
  backend:
    build: 
      context: ./backend
    container_name: gdg_backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:password123@db:5432/gdg_events
      - JWT_SECRET=supersecretjwtkey_for_hackathon_only
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app # Mount local files for hot-reloading in dev
      - /app/node_modules

  # 3. Frontend App (React/Vite -> Nginx)
  frontend:
    build: 
      context: ./frontend
    container_name: gdg_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: # Persist database data even if container stops
